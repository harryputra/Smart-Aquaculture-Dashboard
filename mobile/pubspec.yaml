name: aquasmart_mobile
description: Smart Aquaculture Dashboard – Mobile App (Android & iOS)
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Navigation ──────────────────────────────────────────────
  go_router: ^14.0.0

  # ── State Management ────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── HTTP & Network ───────────────────────────────────────────
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  pretty_dio_logger: ^1.4.0

  # ── Secure Storage ───────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── MQTT ─────────────────────────────────────────────────────
  mqtt_client: ^10.2.1

  # ── Charts ───────────────────────────────────────────────────
  fl_chart: ^0.69.0

  # ── WebView (CCTV & Grafana) ─────────────────────────────────
  webview_flutter: ^4.10.0

  # ── Firebase (Push Notification) ─────────────────────────────
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

  # ── File Upload (Firmware OTA) ────────────────────────────────
  file_picker: ^8.3.3

  # ── Utilities ─────────────────────────────────────────────────
  intl: ^0.20.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.5
  connectivity_plus: ^6.1.4

  # ── UI ────────────────────────────────────────────────────────
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
